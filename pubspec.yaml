name: bajulan_mobile
description: "Aplikasi mobile Kampung Adat Bajulan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  google_fonts: ^6.1.0
  http: ^1.1.0
  webview_flutter: ^4.7.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  # Firebase - Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
